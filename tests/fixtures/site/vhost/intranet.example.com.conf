geo $lan { default 0; 10.0.0.0/8 1; }
server {
    listen 443 ssl;
    server_name intranet.example.com intra.example.com;
    include snippets/modsec-block.conf;
    if ($lan = 0) { return 444; }
    location / { proxy_pass http://192.0.2.20; }
}
server {
    listen 80;
    server_name static.example.com;
    allow 192.0.2.0/24;
    deny all;
    root /var/www;
}
