SecRule REQUEST_URI_RAW|ARGS|REQUEST_HEADERS "@rx (?:^|[\\/])\.{2,3}[\\/]" \
    "id:930110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,t:cmdLine,\
    msg:'Path Traversal Attack (/../) or (/.../)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'application-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    ver:'OWASP_CRS/4.30.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
SecRule REQUEST_FILENAME|ARGS "@pmFromFile lfi-os-files.data" \
    "id:930120,phase:2,block,capture,t:none,msg:'OS File Access Attempt',tag:'attack-lfi',ver:'OWASP_CRS/4.30.0',severity:'CRITICAL'"
