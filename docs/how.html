.btn:hover { text-decoration: none; border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 196, .32); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }

.card:hover { border-color: rgba(37, 99, 196, .35); box-shadow: 0 6px 22px rgba(37, 99, 196, .10); }

.card h3 .ic { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--blue-h), var(--blue-d)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex: none; box-shadow: 0 2px 8px rgba(37, 99, 196, .30); }
.card p { margin: 0; color: var(--muted); font-size: 15px; }

.card ul.src { margin: 6px 0 0; padding-left: 18px; color: var(--ink); font-size: 14.5px; }
.card ul.src li { margin: 4px 0; }
ol.flow { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; counter-reset: s; }
ol.flow li { counter-increment: s; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; box-shadow: var(--shadow); min-width: 0; }
section.alt ol.flow li { background: var(--panel-2); }
ol.flow li::before { content: counter(s); display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--blue-h), var(--blue-d)); color: #fff; font-weight: 700; font-size: 14px; align-items: center; justify-content: center; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(37, 99, 196, .30); }
ol.flow li b { display: block; color: var(--ink); } ol.flow li span { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 9px; margin: 22px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
a.chip:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue-h); flex: none; }
.chip:nth-child(3n+2)::before { background: var(--orange); } .chip:nth-child(3n)::before { background: var(--blue-d); }
ul.ticks { padding-left: 0; list-style: none; margin: 0; } ul.ticks li { padding-left: 32px; position: relative; margin: 9px 0; color: var(--ink); }
ul.ticks li::before { content: "✓"; position: absolute; left: 0; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--blue-h), var(--blue-d)); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(37, 99, 196, .30); }
ul.ticks.no li::before { content: "✕"; background: linear-gradient(135deg, #fb7185, #e11d48); box-shadow: 0 2px 6px rgba(225, 29, 72, .28); }
ul.ticks.warn li::before { content: "!"; background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 2px 6px rgba(217, 119, 6, .28); }
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: n; }
ol.steps li { counter-increment: n; padding-left: 38px; position: relative; margin: 10px 0; color: var(--ink); }
ol.steps li::before { content: counter(n); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #fb7185, #e11d48); color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 2px 6px rgba(225, 29, 72, .28); }
ol.steps.blue li::before { background: linear-gradient(135deg, var(--blue-h), var(--blue-d)); box-shadow: 0 2px 6px rgba(37, 99, 196, .30); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.two.top { align-items: start; } .two > * { min-width: 0; } .two h3:first-child { margin-top: 0; }

.reccard h3 { margin: 0 0 4px; font-size: 18px; }

@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } .hero h1 { font-size: 32px; } nav.links { display: none; } }
/* a palette around the logo blue: every card and step gets its own colour (--c, --c2), as on the project page */
.grid > .card:nth-child(8n+1), ol.flow li:nth-child(6n+1) { --c: #2563c4; --c2: #3a86e6; }
.grid > .card:nth-child(8n+2), ol.flow li:nth-child(6n+2) { --c: #4f46e5; --c2: #818cf8; }
.grid > .card:nth-child(8n+3), ol.flow li:nth-child(6n+3) { --c: #0d9488; --c2: #2dd4bf; }
.grid > .card:nth-child(8n+4), ol.flow li:nth-child(6n+4) { --c: #e8590c; --c2: #ff8a5c; }
.grid > .card:nth-child(8n+5), ol.flow li:nth-child(6n+5) { --c: #db2777; --c2: #f472b6; }
.grid > .card:nth-child(8n+6), ol.flow li:nth-child(6n+6) { --c: #0284c7; --c2: #38bdf8; }
.grid > .card:nth-child(8n+7) { --c: #7c3aed; --c2: #a78bfa; }
.grid > .card:nth-child(8n+8) { --c: #059669; --c2: #34d399; }
.card, ol.flow li { border-top: 3px solid var(--c, var(--blue)); background: linear-gradient(180deg, color-mix(in srgb, var(--c, var(--blue)) 5%, #fff), #fff 70%); }
section.alt .card, section.alt ol.flow li { background: linear-gradient(180deg, color-mix(in srgb, var(--c, var(--blue)) 6%, #fff), var(--panel-2) 70%); }
.card h3 .ic, ol.flow li::before { background: linear-gradient(135deg, var(--c2, var(--blue-h)), var(--c, var(--blue-d))); box-shadow: 0 2px 8px color-mix(in srgb, var(--c, var(--blue)) 35%, transparent); }
.card:hover { border-color: color-mix(in srgb, var(--c, var(--blue)) 40%, var(--border)); border-top-color: var(--c, var(--blue)); }
section#arch { background: radial-gradient(900px 400px at 100% 0%, rgba(99, 102, 241, .07), transparent 60%), radial-gradient(800px 380px at 0% 100%, rgba(13, 148, 136, .06), transparent 60%), var(--bg); }
section#bounds { background: radial-gradient(900px 420px at 0% 0%, rgba(232, 89, 12, .06), transparent 60%), radial-gradient(800px 380px at 100% 100%, rgba(37, 99, 196, .08), transparent 60%), var(--bg); }

<section id="arch"><div class="wrap">
  <h2 data-t="arch_h"></h2><p class="sub" data-t="arch_sub"></p>

    <svg class="archsvg" viewBox="0 0 1100 750" role="img" aria-labelledby="arch-title">
      <title id="arch-title" data-t="arch_h"></title>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>

      <rect class="grp" x="10" y="280" width="860" height="230" rx="12"/>

      <text class="side" x="200" y="604" text-anchor="end">jtwaf</text>
      <text class="side" x="200" y="712" text-anchor="end" data-t="d_outside" data-w="175"></text>

  a_4: 'Request every health-check URL through this nginx and note the status codes.',
  a_5: 'Snapshot the current files: kept in memory for the restore, plus a copy in the root-only state directory.',
  a_6: 'Write the new managed files atomically, run nginx -t, reload, and confirm that new worker processes started.',
  a_7: 'Request the health-check URLs again: every status code must be unchanged.',
  a_8: 'Any failure from the write on puts the snapshot back, runs nginx -t and reloads again; the change shows "apply failed (restored)".',
  v_h: 'Versions, rollback and drift',
  v_1: 'Every apply (change, adoption or restore) gets the next version number and keeps the complete files with their checksums.',
  v_2: 'An approver can restore an earlier version with a note. It goes straight to the apply program (snapshot, nginx -t, reload, health checks, restore on failure), without a sandbox run or a second approval, and is written as a new version.',
  v_3: 'One apply at a time. If another version was applied after a change\'s checks, the checks run again before it is applied.',
  v_4: 'Drift: when a managed file on disk no longer matches the last applied version, someone edited it outside jt-waf-mgr. Changes and restores are refused (recorded at priority crit) until it is resolved, so the edit is never overwritten silently; an approver can explicitly put the current version back.',
  ai_h: 'Event analysis with a self-hosted LLM',
  ai_sub: 'A scheduled job sends grouped events to your own OpenAI-compatible LLM server. Request data is attacker-controlled, so the model only gives verdicts; the program decides what is proposed.',
  ai_s1: 'Events', ai_s1d: 'The last 24 hours by default: external requests no confident rule blocked yet, and requests the anomaly score blocked.',
  ai_s2: 'Candidates', ai_s2d: 'Grouped by the path a rule sees (decoded, normalised, lowercase, no query) and kept with enough events and sources; skipped when a rule or an open change covers the path, or a proposal for it was declined in the last 30 days.',
  ai_s3: 'Program rules', ai_s3d: 'Decided without the model: outside sources asking for secret, backup or configuration file names are probes; one outside address blocked on 5 or more paths is a scanner.',
  ai_s4: 'LLM', ai_s4d: 'Batches of at most 15 candidates; the answer constrained by a JSON schema (plain JSON mode when the server cannot); the data marked untrusted.',
  ai_s5: 'Validation', ai_s5d: 'Only verdicts with a confidence of 0.8 or more. A block regex must start with ^, match the path and not match common paths, paths judged legitimate or regression samples.',
  ai_s6: 'Proposals and alerts', ai_s6d: 'A few ordinary changes per run (5 by default), proposed as "analyst", and alerts to follow up.',
  ai_rules_h: 'What it may do, and what it may not',
  ai_1: 'Propose confident blocks for external sources and, for false positives, the narrowest exclusion: one exact path on one site, specific rules and request parts.',
  ai_2: 'Paths the organisation\'s own addresses use are never proposed for blocking; no exclusion and no false-positive alert when fewer than 3 external sources and no internal ones are involved.',
  ai_3: 'A path called an attack in one of the last 6 runs (within 14 days) is not loosened on one "false positive" verdict.',
  ai_4: 'Alerts: an attack that may have been answered, users hit by a false positive, and an attack in progress (the only kind the model may raise itself); at most 5 of each kind per run.',
  ai_5: 'It never approves and never writes rules. Loosening waits for a person, who enters a fresh one-time code and a note. Its confident blocks apply by themselves only when an administrator turned on their switch and every automatic-application condition holds.',
  ai_6: 'Any LLM error fails closed: the run is recorded with the error and proposes nothing. The API key never appears in what is recorded.',
  ai_7: 'Every run leaves a summary: events analysed, time taken, verdicts, proposals and alerts.',
  ai_note: 'The model can be wrong in both directions. Check the evidence of a proposal before you approve it.',
  crs_h: 'OWASP CRS updates',
  crs_sub: 'Optional and off by default. When jt-waf-mgr manages the CRS, a new release reaches nginx only through the change workflow.',
  crs_s1: 'Check', crs_s1d: 'Daily, or on "check now": the CRS releases on GitHub, the newest of the major version in use. A new major version is only reported.',
  crs_s2: 'Wait', crs_s2d: 'A release is taken once it has been out 7 days (wait_days), so upstream can fix a bad one first.',
  crs_s3: 'Verify', crs_s3d: 'The signature must be valid and made by the pinned CRS release key, which ships with jt-waf-mgr; otherwise the download is not kept.',
  crs_s4: 'Stage', crs_s4d: 'Unpacked (plain files and directories only, size-limited) with a manifest; an alert says an update is ready.',
  crs_s5: 'Compare', crs_s5d: 'An approver proposes the switch. The same recent requests run through the version in use and the new one in the sandbox, and the differences are shown.',
  crs_s6: 'Approve', crs_s6d: 'A person approves. A CRS switch is never applied automatically.',
  crs_s7: 'Install', crs_s7d: 'The root program checks the tarball\'s checksum and signature again, unpacks it itself, accepts it only when it matches the compared files, and points the crs link at crs-<version>.',
  crs_s8: 'Verify or switch back', crs_s8d: 'nginx -t, reload, health checks; on any failure the link is switched back. 3 versions are kept.',
  crs_more_h: 'Going back, and a first installation',
  crs_1: 'Going back to a kept version is a change of its own: compared, approved and switched the same way.',
  crs_2: 'A host without the CRS: the sandbox compares without and with it; the root program installs crs-<version>, the crs link and crs-setup.conf (from its example, unless one exists) and inserts two Include lines right after modsecurity.conf. Any failure takes it all out again.',
  crs_3: 'On a host whose CRS is a plain directory, the first switch renames it to crs-<its version> and makes crs a link to it, so what nginx loads does not change.',
  crs_4: 'If another updater keeps the CRS current on the host (for example a cron job), stop it before you switch this on: two updaters must not work on the same files.',
  bl_h: 'Request volume and temporary IP blocks',
  bl_sub: 'Two features next to the WAF: counts of all traffic, and a short-term deny list for addresses other systems report.',
  rv_h: 'Request volume',
  rv_1: 'Reads the nginx access logs from where the last pass stopped (inode and offset), following rotation.',
  rv_2: 'Keeps only numbers per site and hour: total, 2xx, 3xx, 4xx, 5xx, 403, 444, 429, external requests and bytes. No address, URL or User-Agent.',
  rv_3: 'Puts the WAF numbers in proportion: blocked requests next to all requests.',
  rv_4: 'Optional alerts, off by default: an hour with 5 times a site\'s usual requests over the previous 7 days, or 20 % or more answered with 5xx.',
  ib_h: 'Temporary IP blocks',
  ib_1: 'fail2ban, a SOAR playbook or a script calls POST /api/v1/blocks with a token that has the blocks:write scope; an approver can also block on the Blocked IPs page.',
  ib_2: 'Checked by the web service and again by the root program, which reads the protected networks set in Settings as well: private, loopback, link-local, multicast and reserved addresses, the internal networks, the known scanners, the trusted proxies and the protected list are never blocked.',
  ib_3: 'The database holds the list. The web service queues the whole list for the apply program at most once a minute.',
  ib_4: 'The apply program writes the deny file, runs nginx -t and reloads; when nginx -t or the reload fails, the previous file is put back. The list counts as applied only after nginx reloaded it.',
  ib_5: 'Blocks end by themselves, and the list is written again.',
  il_h: 'Limits',
  il_1: 'A token blocks single addresses only; an approver may block a range up to /24 (IPv4) or /64 (IPv6).',
  il_2: '24 hours by default, at most 7 days from a token and 30 days by hand; nothing is permanent.',
  il_3: 'At most 500 active blocks, 200 per token, and 60 new blocks per token and hour.',
  il_4: 'No change workflow and no approval: a block is temporary data, not configuration. Every add, extension, removal, refusal and expiry is in the audit trail.',
  il_5: 'Included once inside http { }, the file covers every site, also those without ModSecurity. Servers and locations with allow / deny lines of their own do not inherit it; the Blocked IPs page lists them. The file holds deny lines only, so allow / deny lines of your own in the same http { } keep working wherever the include sits.',
  rv_5: 'The site name comes from the access log file name (one log per site). Sites sharing one combined log are counted under (default); give each site its own access_log for per-site numbers.',
  au_h: 'Three automations, three switches',
  au_1: 'Path rules from the program (no LLM needed): a secret or configuration file name asked for from outside only, never answered 2xx and not used internally becomes a confident block proposal. It goes through the change workflow (checks, sandbox, approval) and applies by itself only when an administrator turned on automatic tightening.',
  au_2: 'Loosening (exclusions, rules switched off) always waits for a person with a fresh one-time code and a note. Nothing automatic ever loosens.',
  au_3: 'Automatic IP blocks for secret file scanners (off by default; Settings > Temporary IP blocks). It reads the WAF events, not the access log: one external address that within 60 minutes got a 4xx/5xx for 5 different secret or configuration file names, at least one of them unmistakable (.env, .git, keys, dumps, backups), is blocked on every site for 24 hours; at most 30 such blocks an hour. An address that got a 2xx/3xx for any such name is left to a person, and one a person unblocked is left alone for 7 days. This one skips the change workflow and acts on every site at once: turn it on knowingly.',
  nt_h: 'Notifications, log shipping and alerts',
  nt_sub: 'The web service only writes rows; sending happens elsewhere, so a slow chat service or log server never holds it up.',
  nc_h: 'Notifications',
  nc_1: 'E-mail (text and HTML), Telegram, Microsoft Teams, Slack, Discord, Zulip, Nextcloud Talk, and a generic webhook signed with HMAC-SHA256 over the timestamp and the body.',
  nc_2: 'A matrix of events and channels; messages in English, Traditional Chinese or Japanese with a link back; a test send per channel.',
  nc_3: 'Sent by the notify unit: retried after 1, 5 and 15 minutes, at most 60 messages per channel and hour, and a daily summary at 8:00 by default.',
  nc_4: 'Values from requests are shown as code or escaped: never markup, links or mentions. Bot tokens, webhook URLs and passwords are write-only settings.',
  ls_h: 'Log servers (syslog / SIEM)',
  ls_1: 'Up to 8 destinations, each with its own protocol (local socket, UDP, TCP, TLS), syslog header (RFC 3164 or 5424), record format (JSON, CEF, LEEF 2.0, GELF 1.1, key=value) and content (audit records, WAF events, alerts).',
  ls_2: 'Each destination has its own queue and retries; a test send shows exactly what went out.',
  ls_3: 'Recommended: the local /dev/log, forwarded by the host\'s rsyslog. Sending from the web service straight to a remote host needs that address allowed in its unit.',
  al_h: 'Alerts',
  al_1: 'An attack in progress or one that may have passed, a false positive hitting users, an integrity problem, an outside configuration change, a failed apply or backup, sign-in attacks, a CRS update ready, a traffic spike or many errors.',
  al_2: 'One open alert per thing: seeing it again only counts it.',
  al_3: 'Open until an approver marks it handled with a note, and reminded every 24 hours until then. A false-positive alert closes by itself once its exclusion is applied.',
  al_4: 'Opening and handling an alert are both in the audit trail.',
  in_h: 'Integrity and audit',
  in_sub: 'What protects the program, the record of what happened, and the configuration jt-waf-mgr manages.',
  i1_h: 'Signed releases',
  i1: 'Every release lists the SHA-256 of each file (MANIFEST.sha256), signed with the project\'s RSA-3072 release key; the tarball has its own signature. install.sh checks both before installing and pins the key at the first install; a release signed with another key needs --accept-new-key.',
  i2_h: 'Program check',
  i2: 'Every hour the service compares the installed files with the signed list: nothing changed, missing or extra, no bytecode cache, no symbolic link, the systemd units included. The root apply program does the same before every run and refuses on a mismatch.',
  i3_h: 'Audit hash chain',
  i3: 'Sign-ins, changes, approvals, settings and system tasks each write one record: time, who, from where, what, result. Each stores sha256(previous hash + this record), and database triggers refuse changes and deletions. New records are checked every few minutes, the whole chain once a day.',
  i4_h: 'Anchors',
  i4: 'Every 5 minutes the newest record number and hash are appended to an append-only file (chattr +a) and sent to syslog; every record also goes to syslog with its hash. A rewritten chain no longer matches them. Exports can be checked offline with jt-waf-mgr audit-verify.',
  i5_h: 'Configuration snapshots',
  i5: 'Every 5 minutes, the SHA-256 of every nginx, ModSecurity, CRS and managed file and of the nginx program. A difference is recorded (config.changed) and attributed to jt-waf-mgr (an applied version), registered automation, or outside; an outside change opens an alert and a 7-day warning on the system check page.',
  i6_h: 'Backups',
  i6: 'A daily SQLite online backup (3:00 by default), integrity-checked, with a SHA-256 file and kept 14 days; downloading one needs a one-time code. A failing backup never removes good ones.',
  i7_h: 'Upgrade with rollback',
  i7: 'upgrade.sh checks first (--check changes nothing): the new release verified by the installed program with the pinned key, the configuration accepted by the new code, no apply in progress. It backs up program, units, configuration and database to /var/backups/jt-waf-mgr/, migrates, starts, checks version, manifest and audit chain, and rolls back by itself on any failure. nginx is never touched.',
  i8_h: 'When something is wrong',
  i8: 'Problems become integrity.* audit records at syslog priority crit, repeated every 12 hours while they last. A manual upgrade.sh --rollback rewinds the database, so it is written to a rewind record only root can write and to syslog at priority crit.',
  b_h: 'Security boundaries',
  b_sub: 'A summary of what can reach what, and what the code never does.',
  br_h: 'What can reach what',
  br_1: 'Visitors reach only nginx. The management interface is a separate nginx vhost; the example allows internal networks only and has ModSecurity off, because the interface shows attack strings.',
  br_2: 'The web service listens on 127.0.0.1:8095 and trusts X-Real-IP only from the local nginx.',
  br_3: 'The web service reaches the apply program only through request files in the spool. The apply program trusts nothing but "which version", opens them without following links and takes every path from its own configuration.',
  br_4: 'Only the notify, GeoIP and CRS units reach the internet; the analysis reaches the private network; the web service and the apply program only the loopback.',
  br_5: 'API tokens: one scope per endpoint, optional source networks and expiry, only their SHA-256 stored. No approvals, accounts, tokens or settings.',
  nv_h: 'What never happens',
  nv_1: 'No shell=True: no command line is built from request data.',
  nv_2: 'No innerHTML or v-html: URLs, user agents, matched data, rule texts and the model\'s words are shown as text. The CSP has no unsafe-inline and no third-party origins.',
  nv_3: 'No original values of sensitive fields in the database, and no API to see them.',
  nv_4: 'No secret read back: the LLM key, the MaxMind key, the SMTP password and bot tokens are write-only in the settings.',
  nv_5: 'No loosening without a person, and no approval through an API token.',
  nv_6: 'No writes to the nginx configuration beyond the files listed under Architecture.',
  lim_h: 'Limits',
  lim_1: 'Root on the host can change anything: the anchors and the syslog copy make tampering detectable, not impossible. Keep a copy in a separate SIEM.',
  lim_2: 'In an LXC container the append-only flag must be set from the host, and systemd\'s address rules are not enforced.',
  lim_3: 'The database is not encrypted at rest (the Python standard library has no AES); it is protected by file permissions (0600 in a 0700 directory).',
  more: 'More detail:', sec_policy: 'Security policy', comp_doc: 'Compliance mapping', api_doc: 'API manual',
 },

  units_h: '程序、執行帳號與網路存取',
  u1_h: '網頁服務',
  u1_1: '常駐執行，帳號是 jtwaf，另加擁有 ModSecurity 稽核記錄檔的群組（由 install.sh 加上，通常是 adm）。',
  u1_2: '執行緒：127.0.0.1:8095 的 HTTP 伺服器、收集器、含沙箱的變更檢查、完整性監控、請求量統計與 IP 封鎖清單。',
  u1_3: '只寫入 /var/lib/jt-waf-mgr；讀取 nginx、ModSecurity、CRS 設定檔與存取記錄。',
  u1_4: '網路：只能連 loopback。稽核記錄預設送到本機的 /dev/log；要直接送到遠端記錄伺服器，必須先在這個 unit 加上該位址（IPAddressAllow）。',
  u2_h: '套用程式',
  u2_1: '以 root 執行。佇列目錄出現請求檔時由 jt-waf-mgr-apply.path 啟動，網頁服務本身不會啟動它。',
  u2_2: '只有明確要求時才啟用（install.sh --enable-apply）；在那之前什麼都不寫。',
  u2_3: '只能寫入 /etc/nginx、自己的狀態目錄 /var/lib/jt-waf-mgr-apply 與佇列目錄。',
  u2_4: '網路：只能連 loopback，用來做健康檢查。',
  u3_h: '事件分析',
  u3_1: '計時器每 5 分鐘喚醒一次，超過設定的間隔（預設 180 分鐘）才真的執行；「立即執行」與 LLM 連線測試以請求檔傳入。',
  u3_2: '網路：loopback 與私有位址範圍（LLM 伺服器所在處）。LLM 伺服器在其他位置時，要在 unit 加上它的位址。',
  u3_3: '在設定頁設好事件分析與 LLM 伺服器之前不做任何事。',
  u4_h: '通知',
  u4_1: '有通知排入佇列時啟動，另外每分鐘執行一次，負責重試與提醒。',
  u4_2: '網路：不限制，因為聊天服務與郵件伺服器在網際網路上。它只讀取設定、寫入通知記錄。',
  u5_h: 'GeoIP 更新',
  u5_1: '每日計時器與「立即更新」；要先輸入你的 MaxMind 帳號與金鑰，才會下載 MaxMind 資料庫。',
  u5_2: '只寫入 /var/lib/jt-waf-mgr/geoip。網路：不限制（MaxMind）。',
  u6_h: 'CRS 更新',
  u6_1: '每日計時器與「立即檢查」；除非由 jt-waf-mgr 管理 CRS（預設關閉），否則不做任何事。',
  u6_2: '只寫入 /var/lib/jt-waf-mgr。網路：不限制（GitHub）。它不會改動 nginx：切換 CRS 是一筆要核准的變更。',
  units_note: '所有以 jtwaf 執行的 unit 都設了 ProtectSystem=strict、沒有任何 capability、系統呼叫過濾與 NoNewPrivileges。在 LXC 容器裡，systemd 無法強制執行位址限制（IPAddressDeny、IPAddressAllow）。',
  out_h: 'jt-waf-mgr 在自己目錄以外會寫入的檔案',
  out_1: '納管之後的 ModSecurity 受管理檔案 /etc/nginx/modsec/jt-waf-mgr/before-crs.conf 與 after-crs.conf。納管時也會把 ModSecurity 主設定的 Include 行改成指向它們，只改這一次。',
  out_2: '選用的 IP 封鎖清單 /etc/nginx/jt-waf-mgr/blocked-ips.conf，由你自己在 http { } 裡 include 一次。',
  out_3: '由它管理 CRS 時：crs-<版本> 目錄與 crs 連結；第一次安裝時另有 crs-setup.conf 與兩行 Include。',
  out_4: 'nginx 設定的其他部分一律不寫。記錄的副本會送到記錄伺服器與通知管道。',
  ev_h: '事件收集',
  ev_sub: '收集器在網頁服務裡執行，持續讀取 ModSecurity 的 JSON 稽核記錄檔；每個命中規則的請求在檔案裡是一行。',
  ev_s1: '讀取', ev_s1d: '每 2 秒讀取新的完整行；copytruncate 與改名兩種輪替方式都能接續。',
  ev_s2: '解析', ev_s2d: '時間、站台、方法、路徑、查詢字串、來源位址與連接埠、狀態碼、引擎模式，以及每條命中的規則。',
  ev_s3: '遮蔽', ev_s3d: '敏感欄位（password、token、otp、session 等）的值在寫入前就被取代。',

function pick() {
  const q = new URLSearchParams(location.search).get('lang')
  if (T[q]) return q
  const n = (navigator.language || 'en').toLowerCase()
  return n.startsWith('zh') ? 'zh-TW' : n.startsWith('ja') ? 'ja' : 'en'
}
// an SVG label longer than its box is squeezed into it (data-w: the room it has)
function fit(root) {
  for (const el of root.querySelectorAll('svg text[data-w]')) {
    el.removeAttribute('textLength'); el.removeAttribute('lengthAdjust')
    let w = 0
    try { w = el.getComputedTextLength() } catch (e) { continue }
    if (w > +el.dataset.w) { el.setAttribute('textLength', el.dataset.w); el.setAttribute('lengthAdjust', 'spacingAndGlyphs') }
  }
}
function apply(lang) {
  const d = T[lang]
  document.documentElement.lang = lang
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = d[el.dataset.t] || T.en[el.dataset.t] || ''
  for (const b of document.querySelectorAll('#lang-menu button')) b.setAttribute('aria-checked', b.dataset.lang === lang ? 'true' : 'false')
  document.getElementById('lang-cur').textContent = { en: 'EN', 'zh-TW': '繁中', ja: '日本語' }[lang]
  for (const id of ['home-brand', 'home-btn']) document.getElementById(id).href = 'index.html?lang=' + lang
  const sfx = { 'zh-TW': '.zh-TW', ja: '.ja' }[lang] || ''
  const gh = 'https://github.com/jasoncheng7115/jt-waf-mgr/blob/main/'
  for (const id of ['sec-doc', 'sec-foot']) document.getElementById(id).href = gh + 'SECURITY' + ({ 'zh-TW': '_zh-TW', ja: '_ja' }[lang] || '') + '.md'
  document.getElementById('comp-doc').href = gh + 'docs/COMPLIANCE' + sfx + '.md'
  document.getElementById('api-doc').href = gh + 'docs/API' + sfx + '.md'
  document.getElementById('zm-x').setAttribute('aria-label', d.close)
  fit(document)
  const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u)
}
// one language button; the menu opens below it. Escape, a click outside or picking a language closes it.
const langBtn = document.getElementById('lang-btn'), langMenu = document.getElementById('lang-menu')
function langOpen(open, focus) {
  langMenu.hidden = !open
  langBtn.setAttribute('aria-expanded', open ? 'true' : 'false')
  if (open && focus) (langMenu.querySelector('[aria-checked="true"]') || langMenu.querySelector('button')).focus()
  if (!open && focus) langBtn.focus()
}
langBtn.addEventListener('click', () => langOpen(langMenu.hidden, true))
for (const b of langMenu.querySelectorAll('button')) b.addEventListener('click', () => { apply(b.dataset.lang); langOpen(false, true) })
langMenu.addEventListener('keydown', (e) => {
  const items = [...langMenu.querySelectorAll('button')], i = items.indexOf(document.activeElement)
  if (e.key === 'Escape') { e.preventDefault(); langOpen(false, true) }
  else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus() }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus() }
})
document.addEventListener('click', (e) => { if (!langMenu.hidden && !e.target.closest('.lang')) langOpen(false, false) })
// a diagram opens at full size in the page (scrolls on a phone); X, Escape or a click outside closes it
const zoom = document.getElementById('zoom')
for (const b of document.querySelectorAll('button.zoom')) b.addEventListener('click', () => {
  if (!zoom.showModal) return
  const svg = document.getElementById(b.dataset.fig).querySelector('svg').cloneNode(true)
  for (const el of svg.querySelectorAll('[id]')) el.removeAttribute('id')
  const body = document.getElementById('zm-body')
  body.replaceChildren(svg)
  document.getElementById('zm-title').textContent = svg.querySelector('title').textContent
  zoom.showModal()
  fit(body)
  body.scrollTop = 0; body.scrollLeft = 0
  document.body.classList.add('zm-on')
})
document.getElementById('zm-x').addEventListener('click', () => zoom.close())
zoom.addEventListener('click', (e) => { if (e.target === zoom || e.target.id === 'zm-body') zoom.close() })
zoom.addEventListener('close', () => { document.body.classList.remove('zm-on'); document.getElementById('zm-body').replaceChildren() })
apply(pick())
</script>
