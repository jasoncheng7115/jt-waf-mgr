# OWASP ZAP alerts accepted for jt-waf-mgr, read by tools/zap_scan.py (release gate G6, TEST_PLAN.md).
# One line per alert: <pluginId> <path regex> <reason>. Accepted only where every finding matches the path regex;
# anything else High / Medium / Low fails the release.
# Add a line only after the finding has been reviewed; say why it is not a vulnerability here or what
# compensates for it. Remove the line when the cause is gone.
2      ^/api/v1/.*   Private IP Disclosure: event sources, the internal network list and rule texts are what this tool shows to logged-in staff; never on public pages (login, static files).
10096  ^/api/v1/audit/export$   Timestamp Disclosure: the audit export is a list of time-stamped records by design (admin only).
10062  ^/api/v1/(audit|audit/export|backups)$   PII Disclosure: a SHA-256 (hex) of a backup or audit row can contain a run of digits that passes the card-number check by chance (seen 2026-11-13, a "Maestro" number inside a synthetic backup hash). These admin-only endpoints carry hashes, never card data.
